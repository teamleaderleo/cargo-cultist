name: Fix companion exclusion provenance

on:
  push:
    branches: [fix/protect-companion-exclusion-receipts]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/protect-companion-exclusion-receipts
          fetch-depth: 0

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Apply exact provenance repair
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('examples/agent_context_packet.rs')
          text = path.read_text()

          old = '''    if packet.recent_history.pop().is_some() {
              return Some("recent_history_summary");
          }
          if packet.companion_exclusions.pop().is_some() {
              return Some("companion_exclusion_detail");
          }

          None
          }'''
          new = '''    if packet.recent_history.pop().is_some() {
              return Some("recent_history_summary");
          }

          None
          }'''
          if text.count(old) != 1:
              raise SystemExit('expected exact companion-exclusion eviction block once')
          text = text.replace(old, new)

          marker = '''    #[test]
          fn impossible_protected_core_fails_instead_of_hiding_unknown() {'''
          test = '''    #[test]
          fn companion_exclusion_receipts_are_protected_from_semantic_eviction() {
              let mut packet = synthetic_packet(usize::MAX);
              let expected = packet.companion_exclusions.clone();
              let mut classes = Vec::new();

              while let Some(class) = evict_one_semantic_detail(&mut packet) {
                  classes.push(class);
              }

              assert!(packet.recent_history.is_empty());
              assert!(packet.historical_companions.is_empty());
              assert_eq!(packet.companion_exclusions, expected);
              assert!(!classes.contains(&"companion_exclusion_detail"));
              assert_eq!(packet.companion_exclusions[0].commit.sha, format!("{:<0width$}", "excluded", width = 40));
              assert_eq!(packet.companion_exclusions[0].reason, "broad commit");
          }

          #[test]
          fn budget_below_exact_exclusion_receipt_fails_instead_of_dropping_it() {
              let mut packet = synthetic_packet(512);
              packet.recent_history.clear();
              packet.historical_companions.clear();
              let expected = packet.companion_exclusions.clone();

              let error = compile_packet_to_budget(&mut packet).unwrap_err();
              assert!(matches!(
                  error,
                  SemanticBudgetError::ProtectedCoreTooLarge { .. }
              ));
              assert_eq!(packet.companion_exclusions, expected);
              assert_eq!(packet.companion_exclusions[0].reason, "broad commit");
          }

          #[test]
          fn impossible_protected_core_fails_instead_of_hiding_unknown() {'''
          if text.count(marker) != 1:
              raise SystemExit('expected impossible-core test marker once')
          text = text.replace(marker, test)
          path.write_text(text)
          PY

          cargo fmt -- examples/agent_context_packet.rs
          cargo test --example agent_context_packet

      - name: Commit repaired source and remove one-shot workflow
        run: |
          rm .github/workflows/fix-companion-exclusion-provenance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add examples/agent_context_packet.rs .github/workflows/fix-companion-exclusion-provenance.yml
          git commit -m 'fix: protect exact companion exclusion receipts'
          git push origin HEAD:fix/protect-companion-exclusion-receipts
