name: Repair behavioral run receipt exact bytes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'research/behavioral-trial-run-receipt'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/behavioral-trial-run-receipt
          fetch-depth: 0
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Apply exact-byte admission repair
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('src/behavioral_trial_run.rs')
          text = source.read_text()
          old = 'let arm = validate_worker_packet(plan, &worker_packet)?;'
          if old not in text:
              raise SystemExit('builder validation call not found')
          text = text.replace(
              old,
              'let arm = validate_worker_packet(plan, &worker_packet, raw_worker_packet)?;',
              1,
          )
          old = 'let arm = validate_worker_packet(plan, &packet)?;'
          if old not in text:
              raise SystemExit('receipt validation call not found')
          text = text.replace(
              old,
              'let arm = validate_worker_packet(plan, &packet, receipt.raw_worker_packet.as_bytes())?;',
              1,
          )

          start = text.index('fn validate_worker_packet(')
          end = text.index('fn validate_observation_against_packet(', start)
          replacement = '''fn validate_worker_packet(
              plan: &BehavioralTrialPlan,
              packet: &BehavioralWorkerPacket,
              raw_packet: &[u8],
          ) -> Result<BehavioralTrialArmKind, BehavioralTrialRunError> {
              let control =
                  materialize_worker_packet(plan, BehavioralTrialArmKind::Control).map_err(source_error)?;
              let treatment =
                  materialize_worker_packet(plan, BehavioralTrialArmKind::Treatment).map_err(source_error)?;
              let (arm, expected) = if packet == &control {
                  (BehavioralTrialArmKind::Control, &control)
              } else if packet == &treatment {
                  (BehavioralTrialArmKind::Treatment, &treatment)
              } else {
                  return Err(BehavioralTrialRunError::new(
                      "raw behavioral worker packet does not equal either frozen plan arm",
                  ));
              };

              let mut expected_bytes = serde_json::to_vec_pretty(expected).map_err(|error| {
                  BehavioralTrialRunError::new(format!(
                      "failed to serialize the frozen behavioral worker packet: {error}"
                  ))
              })?;
              expected_bytes.push(b'\\n');
              if raw_packet != expected_bytes.as_slice() {
                  return Err(BehavioralTrialRunError::new(
                      "raw behavioral worker packet bytes do not match the exact materializer serialization",
                  ));
              }
              Ok(arm)
          }

          '''
          source.write_text(text[:start] + replacement + text[end:])

          tests = Path('tests/behavioral_trial_run.rs')
          text = tests.read_text()
          text = text.replace(
              'BehavioralTrialPlan, fingerprint_plan, materialize_worker_packet, parse_behavioral_trial_plan,',
              'BehavioralTrialPlan, BehavioralWorkerPacket, fingerprint_plan, materialize_worker_packet, parse_behavioral_trial_plan,',
              1,
          )
          anchor = 'fn run_receipt(\n'
          if anchor not in text:
              raise SystemExit('run_receipt helper not found')
          helper = '''fn canonical_worker_packet_bytes(packet: &BehavioralWorkerPacket) -> Vec<u8> {
              let mut bytes = serde_json::to_vec_pretty(packet).unwrap();
              bytes.push(b'\\n');
              bytes
          }

          fn run_receipt(
          '''
          text = text.replace(anchor, helper, 1)
          text = text.replace(
              'let raw_packet = serde_json::to_vec(&packet).unwrap();',
              'let raw_packet = canonical_worker_packet_bytes(&packet);',
          )

          test_anchor = '#[test]\nfn raw_worker_output_must_bind_to_exact_packet_and_registered_action() {'
          if test_anchor not in text:
              raise SystemExit('negative-test anchor not found')
          negative = '''#[test]
          fn receipt_builder_rejects_semantically_equal_reformatted_packet_bytes() {
              let plan = plan();
              let packet = materialize_worker_packet(&plan, BehavioralTrialArmKind::Control).unwrap();
              let minified_packet = serde_json::to_vec(&packet).unwrap();
              let raw_output = raw_observation(
                  &plan,
                  BehavioralTrialArmKind::Control,
                  "worker-run:reformatted-packet",
                  "inspect_accepted_guard_detail",
              );

              let error = build_behavioral_trial_run_receipt(
                  &plan,
                  metadata(
                      1,
                      "session:reformatted-packet",
                      "provider:session/reformatted-packet",
                  ),
                  &minified_packet,
                  &raw_output,
              )
              .unwrap_err();
              assert!(error.to_string().contains("exact materializer serialization"));
          }

          #[test]
          fn raw_worker_output_must_bind_to_exact_packet_and_registered_action() {'''
          text = text.replace(test_anchor, negative, 1)
          tests.write_text(text)
          PY
          cargo fmt --all
      - name: Verify focused controls
        run: |
          cargo fmt --all -- --check
          cargo test --test behavioral_trial_run
          cargo test --test behavioral_trial_index_guard_detail
          git diff --check
      - name: Commit repair and remove carrier
        run: |
          git config user.name "Cultist repair carrier"
          git config user.email "actions@users.noreply.github.com"
          git add src/behavioral_trial_run.rs tests/behavioral_trial_run.rs
          git rm -f .github/workflows/repair-behavioral-trial-run-exact-bytes.yml
          git commit -m "fix: bind behavioral receipts to exact packet bytes"
          git push origin HEAD:research/behavioral-trial-run-receipt
