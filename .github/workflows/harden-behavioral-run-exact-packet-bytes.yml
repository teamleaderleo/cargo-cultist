name: Harden behavioral run exact packet bytes

on:
  push:
    branches:
      - research/behavioral-trial-run-receipt
    paths:
      - ".github/workflows/harden-behavioral-run-exact-packet-bytes.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/behavioral-trial-run-receipt
          fetch-depth: 0
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Apply exact-byte admission hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/behavioral_trial_run.rs")
          source = source_path.read_text(encoding="utf-8")
          old = """    let arm = validate_worker_packet(plan, &worker_packet)?;\n\n    let observation: BehavioralTrialObservation =\n"""
          new = """    let arm = validate_worker_packet(plan, &worker_packet)?;\n    require_canonical_worker_packet_bytes(plan, arm, raw_worker_packet)?;\n\n    let observation: BehavioralTrialObservation =\n"""
          assert source.count(old) == 1
          source = source.replace(old, new, 1)

          old = """pub fn evaluate_behavioral_trial_run_pair(\n"""
          helper = """pub fn canonical_materialized_worker_packet_bytes(\n    plan: &BehavioralTrialPlan,\n    arm: BehavioralTrialArmKind,\n) -> Result<Vec<u8>, BehavioralTrialRunError> {\n    let packet = materialize_worker_packet(plan, arm).map_err(source_error)?;\n    let mut bytes = serde_json::to_string_pretty(&packet)\n        .map_err(|error| {\n            BehavioralTrialRunError::new(format!(\n                \"failed to serialize canonical behavioral worker packet: {error}\"\n            ))\n        })?\n        .into_bytes();\n    bytes.push(b'\\n');\n    Ok(bytes)\n}\n\nfn require_canonical_worker_packet_bytes(\n    plan: &BehavioralTrialPlan,\n    arm: BehavioralTrialArmKind,\n    raw_worker_packet: &[u8],\n) -> Result<(), BehavioralTrialRunError> {\n    let expected = canonical_materialized_worker_packet_bytes(plan, arm)?;\n    if raw_worker_packet != expected.as_slice() {\n        return Err(BehavioralTrialRunError::new(\n            \"raw behavioral worker packet bytes differ from the canonical materialized packet file\",\n        ));\n    }\n    Ok(())\n}\n\n"""
          assert source.count(old) == 1
          source = source.replace(old, helper + old, 1)

          old = """    let arm = validate_worker_packet(plan, &packet)?;\n    let observation: BehavioralTrialObservation = serde_json::from_str(&receipt.raw_output)\n"""
          new = """    let arm = validate_worker_packet(plan, &packet)?;\n    require_canonical_worker_packet_bytes(plan, arm, receipt.raw_worker_packet.as_bytes())?;\n    let observation: BehavioralTrialObservation = serde_json::from_str(&receipt.raw_output)\n"""
          assert source.count(old) == 1
          source = source.replace(old, new, 1)
          source_path.write_text(source, encoding="utf-8")

          test_path = Path("tests/behavioral_trial_run.rs")
          test = test_path.read_text(encoding="utf-8")
          old = """    BehavioralTrialRunMetadata, BehavioralTrialRunPair, build_behavioral_trial_run_receipt,\n    evaluate_behavioral_trial_run_pair,\n"""
          new = """    BehavioralTrialRunMetadata, BehavioralTrialRunPair, build_behavioral_trial_run_receipt,\n    canonical_materialized_worker_packet_bytes, evaluate_behavioral_trial_run_pair,\n"""
          assert test.count(old) == 1
          test = test.replace(old, new, 1)
          anchor = """const SAMPLING_SHA256: &str =\n    \"sha256:3c0474dcc347d480cbfa4a9590e8a4361cbaf0ebd75504444a6340bbc0f6109c\";\n"""
          constants = anchor + """const CONTROL_PACKET_FILE_SHA256: &str =\n    \"sha256:6a568aed1eb660141cd7e7759e47edeb10a5c759fe1402689699dd7b6837149e\";\nconst TREATMENT_PACKET_FILE_SHA256: &str =\n    \"sha256:1063efc8ecdf0313b947923dad8216fb9fa43b2e8b8cafa7ab6b63d53eb65c7d\";\n"""
          assert test.count(anchor) == 1
          test = test.replace(anchor, constants, 1)

          old = """    let raw_packet = serde_json::to_vec(&packet).unwrap();\n"""
          assert test.count(old) == 3, test.count(old)
          replacements = [
              """    let raw_packet = canonical_materialized_worker_packet_bytes(plan, arm).unwrap();\n""",
              """    let raw_packet = canonical_materialized_worker_packet_bytes(\n        &plan,\n        BehavioralTrialArmKind::Control,\n    )\n    .unwrap();\n""",
              """    let raw_packet = canonical_materialized_worker_packet_bytes(\n        &plan,\n        BehavioralTrialArmKind::Control,\n    )\n    .unwrap();\n""",
          ]
          for replacement in replacements:
              test = test.replace(old, replacement, 1)

          old = """    assert!(treatment.worker_packet_sha256.starts_with(\"sha256:\"));\n    assert!(treatment.raw_output_sha256.starts_with(\"sha256:\"));\n"""
          new = """    assert_eq!(control.worker_packet_sha256, CONTROL_PACKET_FILE_SHA256);\n    assert_eq!(treatment.worker_packet_sha256, TREATMENT_PACKET_FILE_SHA256);\n    assert!(treatment.raw_output_sha256.starts_with(\"sha256:\"));\n"""
          assert test.count(old) == 1
          test = test.replace(old, new, 1)

          insertion = """
#[test]
fn alternate_json_serialization_of_same_packet_rejects() {
    let plan = plan();
    let packet = materialize_worker_packet(&plan, BehavioralTrialArmKind::Control).unwrap();
    let raw_packet = serde_json::to_vec(&packet).unwrap();
    let raw_output = raw_observation(&plan, &packet, "worker:alternate-json", "block_patch");
    let error = build_behavioral_trial_run_receipt(
        &plan,
        metadata(1, "session-alt", "freshness-alt"),
        &raw_packet,
        &raw_output,
    )
    .unwrap_err();
    assert!(
        error
            .to_string()
            .contains("canonical materialized packet file")
    );
}

"""
          marker = """#[test]\nfn receipt_builder_rejects_nonfresh_or_prior_exposed_runs() {\n"""
          assert test.count(marker) == 1
          test = test.replace(marker, insertion + marker, 1)
          test_path.write_text(test, encoding="utf-8")

          docs_path = Path("research/behavioral-trial-run-receipts.md")
          docs = docs_path.read_text(encoding="utf-8")
          docs = docs.replace(
              "3. requires the parsed packet to equal one exact arm materialized from the frozen plan;",
              "3. requires the parsed packet to equal one exact arm materialized from the frozen plan;\n4. requires the exact raw packet bytes to equal the canonical pretty-JSON materializer file bytes for that arm;",
          )
          docs = docs.replace("4. parses the raw worker output", "5. parses the raw worker output")
          docs = docs.replace("5. binds the observation", "6. binds the observation")
          docs = docs.replace("6. requires the first action", "7. requires the first action")
          docs = docs.replace("7. computes `sha256:<hex>`", "8. computes `sha256:<hex>`", 1)
          docs = docs.replace("8. computes `sha256:<hex>`", "9. computes `sha256:<hex>`", 1)
          docs = docs.replace("9. retains both exact raw JSON strings", "10. retains both exact raw JSON strings")
          needle = """The organizer does not hand-type either content hash.\n"""
          addition = needle + """
For the current neutral Stensibly plan, the canonical packet-file hashes are pinned to the repaired #262 artifact:

```text
control
sha256:6a568aed1eb660141cd7e7759e47edeb10a5c759fe1402689699dd7b6837149e

treatment
sha256:1063efc8ecdf0313b947923dad8216fb9fa43b2e8b8cafa7ab6b63d53eb65c7d
```

Semantically equivalent alternate JSON serialization is rejected. Whitespace/serialization is part of the worker-visible intervention bytes.
"""
          assert docs.count(needle) == 1
          docs = docs.replace(needle, addition, 1)
          docs = docs.replace(
              "- exact raw packet and output SHA-256 receipts are computed by the builder;",
              "- exact canonical #262 packet-file SHA-256 receipts and raw output SHA-256 receipts are computed by the builder;\n- semantically equivalent alternate packet JSON serialization rejects before receipt construction;",
          )
          docs_path.write_text(docs, encoding="utf-8")
          PY

      - name: Verify hardening
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --test behavioral_trial_run
          cargo test
          git diff --check
      - name: Commit source/test/docs hardening
        run: |
          git config user.name "Cultist exact-byte carrier"
          git config user.email "actions@users.noreply.github.com"
          git add src/behavioral_trial_run.rs tests/behavioral_trial_run.rs research/behavioral-trial-run-receipts.md
          git commit -m "research: require exact blind packet file bytes in run receipts"
          git push origin HEAD:research/behavioral-trial-run-receipt
