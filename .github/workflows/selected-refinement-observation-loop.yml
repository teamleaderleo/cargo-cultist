name: Selected refinement observation loop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/selected-refinement-observation-loop.yml"
      - "research/refinement-episodes/cultist-v1.json"
      - "research/refinement-observation-requirements/cultist-v1.json"
      - "research/discriminator-observations/cultist-v1.json"
      - "src/refinement_observation_requirement.rs"
      - "src/observation_frontier.rs"
      - "src/observation_probe_bridge.rs"
      - "src/rust_edit_class_source.rs"
      - "examples/refinement_observation_requirements.rs"
      - "examples/observation_frontiers.rs"
      - "examples/observation_probe_plan.rs"
      - "examples/rust_edit_class_observation.rs"
      - "tests/selected_refinement_observation_loop.rs"

permissions:
  contents: read

jobs:
  selected-oxc-edit-class-loop:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'research/selected-refinement-observation-loop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Cultist
        uses: actions/checkout@v4
        with:
          path: cultist

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build independent readers
        run: |
          cargo build --release \
            --example refinement_observation_requirements \
            --example observation_frontiers \
            --example observation_probe_plan \
            --example rust_edit_class_observation \
            --manifest-path cultist/Cargo.toml

      - name: Compile retained selected exact requirements
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          request = {
              "schema_version": 1,
              "refinements": json.loads(Path("cultist/research/refinement-episodes/cultist-v1.json").read_text()),
              "mappings": json.loads(Path("cultist/research/refinement-observation-requirements/cultist-v1.json").read_text()),
          }
          Path("requirement-request.json").write_text(json.dumps(request), encoding="utf-8")
          PY

          "$PWD/cultist/target/release/examples/refinement_observation_requirements" \
            < requirement-request.json \
            > selected-requirements.json
          cat selected-requirements.json

      - name: Extract retained Oxc selected requirement
        id: requirement
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evaluation = json.loads(Path("selected-requirements.json").read_text())
          selected = next(
              row for row in evaluation["selected"]
              if row["episode_id"] == "history/oxc-edit-class-v1"
          )
          assert selected["candidate_id"] == "syntax-changing-current-cohort", selected
          assert selected["missing_discriminator_refs"] == [], selected
          assert len(selected["requirements"]) == 1, selected
          requirement = selected["requirements"][0]
          expected_revision = "228e8e0f85c0e7aeded02c5e27fd810004d3b41a"
          expected_path = "crates/oxc_linter/src/rules.rs"
          expected_subject = f"oxc-project/oxc@{expected_revision}:{expected_path}"
          assert requirement == {
              "discriminator_id": "edit_class",
              "subject_ref": expected_subject,
          }, requirement
          Path("oxc-requirement.json").write_text(json.dumps(requirement), encoding="utf-8")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as out:
              out.write(f"revision={expected_revision}\n")
              out.write(f"path={expected_path}\n")
              out.write(f"subject_ref={expected_subject}\n")
          PY

      - name: Create withheld observation batch with wrong-subject controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          requirement = json.loads(Path("oxc-requirement.json").read_text())
          batch = json.loads(Path("cultist/research/discriminator-observations/cultist-v1.json").read_text())
          exact = next(
              row for row in batch["observations"]
              if row["discriminator_id"] == requirement["discriminator_id"]
              and row["subject_ref"] == requirement["subject_ref"]
          )
          batch["observations"] = [
              row for row in batch["observations"]
              if row["observation_id"] != exact["observation_id"]
          ]

          wrong_path = json.loads(json.dumps(exact))
          wrong_path["observation_id"] = "selected-loop:wrong-path-edit-class"
          wrong_path["subject_ref"] = requirement["subject_ref"].replace("/rules.rs", "/other.rs")
          wrong_path["source_receipt"] = "research:selected-loop:wrong-path"
          batch["observations"].append(wrong_path)

          pinned = json.loads(json.dumps(exact))
          pinned["observation_id"] = "selected-loop:pinned-head-control"
          pinned["subject_ref"] = (
              "oxc-project/oxc@8783524015b1e6ff1c39ccf426df0bb07cbbc588:"
              "crates/oxc_linter/src/rules.rs"
          )
          pinned["source_receipt"] = "github-actions:run/32258599172#pinned-head-control"
          pinned["value_state"] = {
              "state": "unknown",
              "reason_ref": "rust-edit-class:anchor-unchanged:pinned-head-control",
          }
          batch["observations"].append(pinned)
          Path("withheld-observations.json").write_text(json.dumps(batch), encoding="utf-8")
          PY

      - name: Require selected exact frontier missing before acquisition
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          request = {
              "schema_version": 2,
              "requirements": [json.loads(Path("oxc-requirement.json").read_text())],
              "observations": json.loads(Path("withheld-observations.json").read_text()),
          }
          Path("missing-frontier-request.json").write_text(json.dumps(request), encoding="utf-8")
          PY

          "$PWD/cultist/target/release/examples/observation_frontiers" \
            < missing-frontier-request.json \
            > missing-frontier.json
          cat missing-frontier.json

          python - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path("missing-frontier.json").read_text())["frontiers"][0]
          assert receipt["status"] == "missing", receipt
          assert receipt["current"] == [], receipt
          assert len(receipt["other_subject"]) == 2, receipt
          PY

      - name: Checkout pinned Oxc history
        uses: actions/checkout@v4
        with:
          repository: oxc-project/oxc
          ref: 8783524015b1e6ff1c39ccf426df0bb07cbbc588
          fetch-depth: 200
          persist-credentials: false
          path: target

      - name: Verify selected requirement still names latest focused anchor commit
        env:
          EXPECTED_REVISION: ${{ steps.requirement.outputs.revision }}
          TARGET_PATH: ${{ steps.requirement.outputs.path }}
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "8783524015b1e6ff1c39ccf426df0bb07cbbc588"
          focused="$(git -C target log --no-merges -1 --format='%H' -- "$TARGET_PATH")"
          test "$focused" = "$EXPECTED_REVISION"
          test -n "$(git -C target diff-tree --no-commit-id --name-only -r "$focused" -- "$TARGET_PATH")"
          git -C target show --no-patch --format='%H %s' "$focused"

      - name: Preserve pinned repository-head UNKNOWN control
        env:
          TARGET_PATH: ${{ steps.requirement.outputs.path }}
        run: |
          set -euo pipefail
          "$PWD/cultist/target/release/examples/rust_edit_class_observation" \
            "$PWD/target" \
            oxc-project/oxc \
            8783524015b1e6ff1c39ccf426df0bb07cbbc588 \
            "$TARGET_PATH" \
            > pinned-head-source.json
          python - <<'PY'
          import json
          from pathlib import Path
          observation = json.loads(Path("pinned-head-source.json").read_text())["observation"]
          assert observation["value_state"]["state"] == "unknown", observation
          assert "anchor-unchanged" in observation["value_state"]["reason_ref"], observation
          PY

      - name: Checkout selected focused commit
        env:
          EXPECTED_REVISION: ${{ steps.requirement.outputs.revision }}
        run: |
          set -euo pipefail
          git -C target checkout -q "$EXPECTED_REVISION"
          test "$(git -C target rev-parse HEAD)" = "$EXPECTED_REVISION"

      - name: Execute selected source producer
        env:
          EXPECTED_REVISION: ${{ steps.requirement.outputs.revision }}
          TARGET_PATH: ${{ steps.requirement.outputs.path }}
        run: |
          set -euo pipefail
          "$PWD/cultist/target/release/examples/rust_edit_class_observation" \
            "$PWD/target" \
            oxc-project/oxc \
            "$EXPECTED_REVISION" \
            "$TARGET_PATH" \
            > source-result.json
          cat source-result.json

      - name: Require source output matches selected exact requirement
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          requirement = json.loads(Path("oxc-requirement.json").read_text())
          source = json.loads(Path("source-result.json").read_text())
          assert source["observation"]["discriminator_id"] == requirement["discriminator_id"], source
          assert source["observation"]["subject_ref"] == requirement["subject_ref"], source
          assert source["bridge"]["observation_discriminator_id"] == requirement["discriminator_id"], source
          assert source["bridge"]["observation_subject_ref"] == requirement["subject_ref"], source
          assert source["observation"]["value_state"] == {
              "state": "known",
              "value_ref": "syntax_changed",
          }, source
          assert source["observation"]["applicability"]["status"] == "applies", source
          PY

      - name: Plan exact selected observation probe
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source = json.loads(Path("source-result.json").read_text())
          missing = json.loads(Path("missing-frontier.json").read_text())["frontiers"][0]
          subject = source["subject"]
          request = {
              "schema_version": 1,
              "frontier": missing,
              "bridges": [source["bridge"]],
              "context": {
                  "repository": subject["repository"],
                  "revision": subject["revision"],
                  "path": subject["path"],
              },
              "probes": [source["probe"]],
              "allow_effectful": False,
              "policy": "conservative",
          }
          Path("plan-request.json").write_text(json.dumps(request), encoding="utf-8")
          PY

          "$PWD/cultist/target/release/examples/observation_probe_plan" \
            < plan-request.json \
            > plan.json
          cat plan.json

          python - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path("plan.json").read_text())
          assert plan["frontier_status"] == "missing", plan
          assert plan["status"] == "planned", plan
          assert plan["evidence_plan"]["status"] == "selected", plan
          PY

      - name: Feed produced observation into selected exact frontier
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          batch = json.loads(Path("withheld-observations.json").read_text())
          source = json.loads(Path("source-result.json").read_text())
          batch["observations"].append(source["observation"])
          request = {
              "schema_version": 2,
              "requirements": [json.loads(Path("oxc-requirement.json").read_text())],
              "observations": batch,
          }
          Path("current-frontier-request.json").write_text(json.dumps(request), encoding="utf-8")
          PY

          "$PWD/cultist/target/release/examples/observation_frontiers" \
            < current-frontier-request.json \
            > current-frontier.json
          cat current-frontier.json

      - name: Assert complete selected refinement acquisition loop
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          requirement = json.loads(Path("oxc-requirement.json").read_text())
          missing = json.loads(Path("missing-frontier.json").read_text())["frontiers"][0]
          plan = json.loads(Path("plan.json").read_text())
          source = json.loads(Path("source-result.json").read_text())
          current = json.loads(Path("current-frontier.json").read_text())["frontiers"][0]

          assert missing["status"] == "missing", missing
          assert plan["frontier_status"] == "missing", plan
          assert source["observation"]["subject_ref"] == requirement["subject_ref"], source
          assert current["status"] == "current", current
          assert current["current"][0]["value_ref"] == "syntax_changed", current
          assert len(current["other_subject"]) == 2, current

          print(json.dumps({
              "episode_id": "history/oxc-edit-class-v1",
              "candidate_id": "syntax-changing-current-cohort",
              "requirement": requirement,
              "initial_frontier": missing["status"],
              "selected_probe": plan["evidence_plan"]["selected"]["id"],
              "produced_value": current["current"][0]["value_ref"],
              "final_frontier": current["status"],
              "other_subject_controls": len(current["other_subject"]),
          }, indent=2, sort_keys=True))
          PY
