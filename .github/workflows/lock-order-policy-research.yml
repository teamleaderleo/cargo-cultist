name: Lock order policy research

on:
  push:
    branches:
      - experiment/lock-order-policy
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  wgpu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cargo-cultist
        uses: actions/checkout@v4
        with:
          path: cultist
          persist-credentials: false

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Probe quality gates
        working-directory: cultist
        run: |
          cargo fmt --check
          cargo clippy --example lock_order_policy -- -D warnings
          cargo test --example lock_order_policy

      - name: Checkout exact WGPU trunk case
        uses: actions/checkout@v4
        with:
          repository: gfx-rs/wgpu
          ref: 422b1c3a2c08feb39e63fdb7ca2798b26803d427
          path: corpus/wgpu-trunk
          persist-credentials: false

      - name: Detect trunk rank contradiction
        run: |
          set -euo pipefail
          mkdir -p research-output
          cargo run --quiet --manifest-path cultist/Cargo.toml --example lock_order_policy -- \
            corpus/wgpu-trunk \
            wgpu-core/src/lock/rank.rs \
            wgpu-core/src/device/queue.rs \
            compact_blas_inner \
            | tee research-output/wgpu-trunk-lock-order.txt
          grep -F 'FINDING: declared lock-rank order contradicted by lexical acquisition' research-output/wgpu-trunk-lock-order.txt
          grep -F '`pending_writes` (QUEUE_PENDING_WRITES) is still held when `command_indices` (DEVICE_COMMAND_INDICES) is acquired.' research-output/wgpu-trunk-lock-order.txt
          grep -F 'The rank DAG does not list `DEVICE_COMMAND_INDICES` as an allowed follower of `QUEUE_PENDING_WRITES`.' research-output/wgpu-trunk-lock-order.txt

      - name: Checkout exact public repair head
        uses: actions/checkout@v4
        with:
          repository: andyleiserson/wgpu
          ref: 7350b0c8d0acb2d410e3f5922fd4aba8407d5cbc
          path: corpus/wgpu-repair
          persist-credentials: false

      - name: Keep repaired common order clean
        run: |
          set -euo pipefail
          cargo run --quiet --manifest-path cultist/Cargo.toml --example lock_order_policy -- \
            corpus/wgpu-repair \
            wgpu-core/src/lock/rank.rs \
            wgpu-core/src/device/queue.rs \
            compact_blas_inner \
            | tee research-output/wgpu-repair-lock-order.txt
          grep -F 'guard `command_indices_lock` acquires `command_indices` as rank `DEVICE_COMMAND_INDICES`' research-output/wgpu-repair-lock-order.txt
          grep -F 'guard `pending_writes` acquires `pending_writes` as rank `QUEUE_PENDING_WRITES`' research-output/wgpu-repair-lock-order.txt
          grep -F 'Every supported acquisition made while another named guard remained held is permitted by the declared rank DAG.' research-output/wgpu-repair-lock-order.txt
          if grep -Fq 'FINDING: declared lock-rank order contradicted' research-output/wgpu-repair-lock-order.txt; then
            echo 'repaired WGPU order still emitted a rank contradiction' >&2
            exit 1
          fi

      - name: Upload research receipt
        uses: actions/upload-artifact@v4
        with:
          name: lock-order-policy-research
          path: research-output/
          if-no-files-found: error
