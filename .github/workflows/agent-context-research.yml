name: Agent context packet research

on:
  push:
    branches:
      - research/agent-context-packet
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cargo-cultist
        uses: actions/checkout@v4
        with:
          path: cultist
          fetch-depth: 0
          persist-credentials: false

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build research example
        working-directory: cultist
        run: cargo build --example agent_context_packet

      - name: Self packet
        run: |
          mkdir -p research-output
          cultist/target/debug/examples/agent_context_packet \
            cultist/src/main.rs \
            > research-output/cargo-cultist-main.json
          python -m json.tool research-output/cargo-cultist-main.json >/dev/null

      - name: Checkout SmolRunner corpus pin
        uses: actions/checkout@v4
        with:
          repository: teamleaderleo/smolrunner
          ref: ed3b70e375a57eabce26f2311f798f75b33bdeb0
          path: corpus/smolrunner
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: SmolRunner clone-runtime packet
        run: |
          cultist/target/debug/examples/agent_context_packet \
            corpus/smolrunner/src/disposable_clone_runtime.rs \
            > research-output/smolrunner-clone-runtime.json
          python -m json.tool research-output/smolrunner-clone-runtime.json >/dev/null

      - name: SmolRunner host-preparation packet
        run: |
          cultist/target/debug/examples/agent_context_packet \
            corpus/smolrunner/src/host_preparation_command.rs \
            > research-output/smolrunner-host-preparation.json
          python -m json.tool research-output/smolrunner-host-preparation.json >/dev/null

      - name: Check agent-context discriminators
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          clone = json.loads(Path('research-output/smolrunner-clone-runtime.json').read_text())
          host = json.loads(Path('research-output/smolrunner-host-preparation.json').read_text())

          for packet in (clone, host):
              assert packet['analysis'] == 'agent_context'
              assert packet['budget']['max_history_commits'] == 20
              assert any(item['path'] == 'AGENTS.md' for item in packet['guidance'])
              assert packet['unknowns']
              assert packet['historical_companions']

          clone_subjects = [item['subject'].lower() for item in clone['recent_history']]
          assert any('duplicate worker readiness probes' in subject for subject in clone_subjects)
          assert any('live admission latency' in subject for subject in clone_subjects)
          assert any('redundant clone admission polls' in subject for subject in clone_subjects)
          assert any('clone preflight before durable checkpoint' in subject for subject in clone_subjects)

          host_subjects = [item['subject'].lower() for item in host['recent_history']]
          assert any('confirmation to exact durable plan' in subject for subject in host_subjects)
          PY

      - name: Upload research packets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-context-packets
          path: research-output/
          if-no-files-found: error
