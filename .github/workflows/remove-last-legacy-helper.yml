name: Remove final legacy renderer helper

on:
  push:
    branches:
      - feature/unified-report-rendering

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove helper
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/diff.rs')
          text = path.read_text()
          block = '''fn print_top_counts(counts: &BTreeMap<String, usize>) {
    println!(
        "  Repository precedent counts: {}.",
        top_counts_summary(counts)
    );
}

'''
          text = text.replace(block, '')
          path.write_text(text)
          PY
          cargo fmt
      - name: Commit cleanup if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/diff.rs
          git commit -m 'Remove final legacy text helper'
          git push
