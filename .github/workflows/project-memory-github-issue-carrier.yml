name: GitHub issue project-memory carrier

on:
  pull_request:

permissions:
  contents: read

jobs:
  linux-fieldwork:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Cultist
        uses: actions/checkout@v4

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Check collector syntax
        run: |
          python -m py_compile \
            scripts/project_memory_github.py \
            scripts/project_memory_github_issue.py

      - name: Collect Linux Fieldwork #675
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/project_memory_github_issue.py \
            --repository teamleaderleo/linux-fieldwork \
            --anchor-issue 675 \
            --max-artifacts 8 \
            --output packet.json \
            > /tmp/project-memory-issue-collector.stdout

      - name: Validate packet through Rust boundary
        run: |
          cargo run --quiet --example project_memory_packet \
            < packet.json \
            > summary.json

      - name: Assert Linux Fieldwork discriminator
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          packet = json.loads(Path("packet.json").read_text())
          summary = json.loads(Path("summary.json").read_text())

          assert packet["repository"] == "teamleaderleo/linux-fieldwork"
          assert packet["anchor"] == {"kind": "issue", "number": 675}
          assert summary["artifact_count"] == 4, summary
          assert summary["edge_count"] == 3, summary
          assert summary["anchor_changed_paths"] == [], summary

          links = summary["explicit_anchor_links"]
          cases = sorted(link["target"]["number"] for link in links)
          assert cases == [609, 611, 645], links
          assert all(link["relation"] == "related" for link in links), links
          assert all("Primary case:" in link["evidence"] for link in links), links

          by_number = {
              artifact["reference"]["number"]: artifact
              for artifact in packet["artifacts"]
          }
          assert set(by_number) == {609, 611, 645, 675}
          assert all(
              by_number[number]["reference"]["kind"] == "issue"
              for number in by_number
          )
          assert "Publication before ownership" in packet["artifacts"][0]["evidence_text"]
          assert "False clean-state certification" in packet["artifacts"][0]["evidence_text"]
          assert "Dirty state lost across a fallible eviction boundary" in packet["artifacts"][0]["evidence_text"]
          PY

      - name: Upload carrier receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-memory-issue-carrier-${{ github.run_id }}
          path: |
            packet.json
            summary.json
          if-no-files-found: error
