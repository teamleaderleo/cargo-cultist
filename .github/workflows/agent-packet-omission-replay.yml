name: Agent packet omission replay

on:
  push:
    branches:
      - experiment/67-packet-omission-receipts
  pull_request:
    branches:
      - main
    paths:
      - examples/agent_context_packet.rs
      - .github/workflows/agent-packet-omission-replay.yml

permissions:
  contents: read

jobs:
  packet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cargo-cultist
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Example quality gates
        run: |
          cargo fmt --check
          cargo clippy --example agent_context_packet -- -D warnings

      - name: Build local packet
        run: |
          cargo run --quiet --example agent_context_packet -- src/diff.rs > /tmp/agent-packet.json

      - name: Verify omission and byte receipts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          raw = Path('/tmp/agent-packet.json').read_bytes()
          assert raw.endswith(b'\n')
          payload = raw[:-1]
          packet = json.loads(payload)

          assert packet['schema_version'] == 2
          assert packet['serialized_bytes'] == len(payload), (
              packet['serialized_bytes'], len(payload)
          )
          assert 'hard byte budget' in ' '.join(packet['unknowns']).lower()

          for relation in packet['historical_companions']:
              assert len(relation['examples']) + relation['examples_omitted'] == relation['support']
              expected_counterexamples = relation['opportunities'] - relation['support']
              assert (
                  len(relation['counterexamples']) + relation['counterexamples_omitted']
                  == expected_counterexamples
              )

          truncated_relations = [
              relation for relation in packet['historical_companions']
              if relation['examples_omitted'] or relation['counterexamples_omitted']
          ]
          if truncated_relations:
              assert any(
                  'omitted examples or counterexamples' in item
                  for item in packet['truncation']
              )
          PY
