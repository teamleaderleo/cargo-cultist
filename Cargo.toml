[package]
name = "cargo-cultist"
version = "0.1.0"
edition = "2024"
description = "Repository-aware analysis for Rust codebases"
repository = "https://github.com/teamleaderleo/cargo-cultist"
readme = "README.md"

[dependencies]
proc-macro2 = { version = "1.0", features = ["span-locations"] }
syn = { version = "2.0", features = ["full", "visit"] }
walkdir = "2.5"
