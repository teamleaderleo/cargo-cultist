name: Fix durable obligation clearing discriminator

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'fix/170-clearing-condition-discriminator'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/170-clearing-condition-discriminator
          fetch-depth: 0
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Enforce singular clearing discriminator
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('src/durable_obligation.rs')
          text = source.read_text()

          needle = "        validate_discriminator(&condition.discriminator)?;\n        require_coordinates(&condition.requirements, \"clearing condition requirements\")?;"
          replacement = "        validate_discriminator(&condition.discriminator)?;\n        if condition.discriminator != obligation.missing_discriminator {\n            return Err(DurableObligationError::new(\n                \"every clearing condition must answer the missing discriminator\",\n            ));\n        }\n        require_coordinates(&condition.requirements, \"clearing condition requirements\")?;"
          if text.count(needle) != 1:
              raise SystemExit(f'expected one condition-validation anchor, found {text.count(needle)}')
          text = text.replace(needle, replacement, 1)

          start_marker = "    if !obligation\n        .clearing_conditions\n        .iter()\n        .any(|condition| condition.discriminator == obligation.missing_discriminator)\n    {"
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('old existential discriminator validation not found')
          end_marker = "\n\n    Ok(())"
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('validation block end not found')
          text = text[:start] + text[end + 2:]

          test_marker = "    #[test]\n    fn durable_record_round_trips_for_fresh_worker_handoff() {"
          if text.count(test_marker) != 1:
              raise SystemExit(f'expected one test insertion anchor, found {text.count(test_marker)}')
          mixed_test = """    #[test]
          fn mixed_clearing_conditions_reject_before_wrong_kind_receipt_can_clear() {
              let mut record = obligation();
              let wrong_discriminator = DiscriminatorKey {
                  kind: "target_test_listing".to_string(),
                  target: record.missing_discriminator.target.clone(),
              };
              record.clearing_conditions.push(ClearingCondition {
                  discriminator: wrong_discriminator.clone(),
                  requirements: requirements("owner/repo", Some("head-a")),
              });
              let wrong_receipt = ClearingEvidenceReceipt {
                  id: "listing-head-a".to_string(),
                  discriminator: wrong_discriminator,
                  requirements: requirements("owner/repo", Some("head-a")),
              };

              let error = evaluate_obligation(
                  &record,
                  &[wrong_receipt],
                  &context(Some("head-a")),
              )
              .unwrap_err();
              assert!(
                  error
                      .to_string()
                      .contains("every clearing condition must answer the missing discriminator")
              );
          }

          """
          # The YAML run block removes its own indentation. Dedent the inserted Rust fixture.
          mixed_test = '\n'.join(line[10:] if line.startswith('          ') else line for line in mixed_test.splitlines()) + '\n'
          text = text.replace(test_marker, mixed_test + test_marker, 1)
          source.write_text(text)

          docs = Path('research/durable-unknown-obligation.md')
          text = docs.read_text()
          sentence = 'A clearing condition names an exact typed discriminator plus exact applicability requirements. A supplied receipt must match both before it can participate in clearing.\n'
          addition = sentence + '\nBecause v0 carries one singular `missing_discriminator`, every clearing condition must name that same discriminator. Heterogeneous alternative evidence species require a future explicit predicate/OR carrier; a plain condition list cannot grant unrelated evidence clearing authority.\n'
          if text.count(sentence) != 1:
              raise SystemExit('research-note clearing-condition sentence not found')
          text = text.replace(sentence, addition, 1)
          old_control = '- a clearing condition must actually answer the declared missing discriminator.\n'
          new_control = '- every clearing condition must answer the declared singular missing discriminator;\n- a mixed valid + wrong-kind condition set rejects before the wrong-kind receipt can clear.\n'
          if text.count(old_control) != 1:
              raise SystemExit('research-note control line not found')
          docs.write_text(text.replace(old_control, new_control, 1))
          PY
          cargo fmt --all
      - name: Verify focused controls
        run: |
          cargo fmt --all -- --check
          cargo test durable_obligation::tests
          cargo test --test durable_obligation
          git diff --check
      - name: Commit fix and remove carrier
        run: |
          git config user.name "Cultist repair carrier"
          git config user.email "actions@users.noreply.github.com"
          git add src/durable_obligation.rs research/durable-unknown-obligation.md
          git rm -f .github/workflows/fix-170-clearing-condition-discriminator.yml
          git commit -m "fix: require every clearing condition to answer the missing discriminator"
          git push origin HEAD:fix/170-clearing-condition-discriminator
