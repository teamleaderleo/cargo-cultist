name: Format generated missing companion experiment

on:
  push:
    branches:
      - experiment/generated-missing-companion-finding
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/generated-missing-companion-finding
      - name: Install rustfmt
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Apply rustfmt
        run: cargo fmt
      - name: Commit formatting when needed
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add examples/generated_missing_companion.rs
          git commit -m 'style: format generated companion experiment'
          git push origin HEAD:experiment/generated-missing-companion-finding
