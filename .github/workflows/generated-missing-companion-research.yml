name: Generated missing companion research

on:
  push:
    branches:
      - experiment/generated-missing-companion-finding
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  oxc-counterfactual:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cargo-cultist
        uses: actions/checkout@v4
        with:
          path: cultist
          persist-credentials: false

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Probe quality gates
        working-directory: cultist
        run: |
          cargo fmt --check
          cargo clippy --example generated_missing_companion -- -D warnings
          cargo test --example generated_missing_companion

      - name: Checkout Oxc held-out target with full history
        uses: actions/checkout@v4
        with:
          repository: oxc-project/oxc
          ref: 228e8e0f85c0e7aeded02c5e27fd810004d3b41a
          path: corpus/oxc
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Build held-out semantic source-only counterfactual
        working-directory: corpus/oxc
        run: |
          set -euo pipefail
          target="$(git rev-parse HEAD)"
          parent="$(git rev-parse HEAD^)"
          printf '%s\n' "$target" > /tmp/oxc-semantic-target
          printf '%s\n' "$parent" > /tmp/oxc-semantic-parent
          git diff "$parent" "$target" -- crates/oxc_linter/src/rules.rs > /tmp/oxc-semantic-source.patch
          test -s /tmp/oxc-semantic-source.patch
          git reset --hard "$parent"
          git clean -fdx
          git apply /tmp/oxc-semantic-source.patch
          test "$(git diff --name-only HEAD -- | wc -l)" -eq 1
          test "$(git diff --name-only HEAD --)" = "crates/oxc_linter/src/rules.rs"

      - name: Detect held-out missing generated companions
        run: |
          set -euo pipefail
          mkdir -p research-output
          cargo run --quiet --manifest-path cultist/Cargo.toml --example generated_missing_companion -- \
            corpus/oxc \
            tasks/linter_codegen/src/main.rs \
            crates/oxc_linter/src/rules.rs \
            100 \
            | tee research-output/oxc-semantic-source-only.txt
          grep -F 'FINDING: generated companions absent from a source-syntax change' research-output/oxc-semantic-source-only.txt
          grep -F 'Generator function `generate_rule_runner_impls` reads `crates/oxc_linter/src/rules.rs` and writes `crates/oxc_linter/src/generated/rule_runner_impls.rs`.' research-output/oxc-semantic-source-only.txt
          grep -F 'Generator function `generate_rules_enum_file` reads `crates/oxc_linter/src/rules.rs` and writes `crates/oxc_linter/src/generated/rules_enum.rs`.' research-output/oxc-semantic-source-only.txt
          grep -E 'generated/rule_runner_impls\.rs` changed in [0-9]+/[0-9]+ comparable Rust syntax-changing source commits \(100\.0%\)' research-output/oxc-semantic-source-only.txt
          grep -E 'generated/rules_enum\.rs` changed in [0-9]+/[0-9]+ comparable Rust syntax-changing source commits \(100\.0%\)' research-output/oxc-semantic-source-only.txt
          grep -F '`crates/oxc_linter/src/generated/rule_runner_impls.rs` is absent from the current worktree diff.' research-output/oxc-semantic-source-only.txt
          grep -F '`crates/oxc_linter/src/generated/rules_enum.rs` is absent from the current worktree diff.' research-output/oxc-semantic-source-only.txt
          grep -F 'Was `cargo lintgen` intentionally deferred' research-output/oxc-semantic-source-only.txt

      - name: Build exact docs-only exception counterfactual
        working-directory: corpus/oxc
        run: |
          set -euo pipefail
          git reset --hard
          git clean -fdx
          git checkout --detach 5e113baf716b9f3781331b268b4142d23cac0541
          target="$(git rev-parse HEAD)"
          parent="$(git rev-parse HEAD^)"
          git diff "$parent" "$target" -- crates/oxc_linter/src/rules.rs > /tmp/oxc-docs-source.patch
          test -s /tmp/oxc-docs-source.patch
          git reset --hard "$parent"
          git clean -fdx
          git apply /tmp/oxc-docs-source.patch
          test "$(git diff --name-only HEAD -- | wc -l)" -eq 1
          test "$(git diff --name-only HEAD --)" = "crates/oxc_linter/src/rules.rs"

      - name: Keep docs-only exception quiet
        run: |
          set -euo pipefail
          cargo run --quiet --manifest-path cultist/Cargo.toml --example generated_missing_companion -- \
            corpus/oxc \
            tasks/linter_codegen/src/main.rs \
            crates/oxc_linter/src/rules.rs \
            100 \
            | tee research-output/oxc-docs-source-only.txt
          grep -F 'source Rust syntax changed: false' research-output/oxc-docs-source-only.txt
          grep -F 'NO FINDING' research-output/oxc-docs-source-only.txt
          if grep -Fq 'FINDING: generated companions absent' research-output/oxc-docs-source-only.txt; then
            echo 'docs-only exception incorrectly emitted a finding' >&2
            exit 1
          fi

      - name: Upload research receipt
        uses: actions/upload-artifact@v4
        with:
          name: generated-missing-companion-research
          path: research-output/
          if-no-files-found: error
