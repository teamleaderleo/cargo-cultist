name: Cleanup unified renderer branch

on:
  pull_request:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/unified-report-rendering'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Remove legacy printers
        run: |
          python - <<'PY'
          from pathlib import Path

          diff = Path('src/diff.rs')
          text = diff.read_text()
          start = text.find('pub fn print_diff_report(')
          end = text.find('fn git_diff(', start) if start >= 0 else -1
          if start >= 0 and end >= 0:
              text = text[:start] + text[end:]
          start = text.find('fn print_top_counts(')
          end = text.find('fn relative_path(', start) if start >= 0 else -1
          if start >= 0 and end >= 0:
              text = text[:start] + text[end:]
          diff.write_text(text)

          modules = Path('src/test_modules.rs')
          text = modules.read_text()
          text = text.replace('use std::collections::{BTreeMap, BTreeSet};\n', '')
          start = text.find('pub fn print_test_module_report(')
          end = text.find('fn should_visit(', start) if start >= 0 else -1
          if start >= 0 and end >= 0:
              text = text[:start] + text[end:]
          modules.write_text(text)
          PY
          cargo fmt
      - name: Commit cleanup if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git commit -m 'Remove legacy text rendering paths'
          git push
