name: Generator root provenance replay

on:
  push:
    branches:
      - fix/65-generator-root-provenance
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oxc-generator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cargo-cultist
        uses: actions/checkout@v4
        with:
          path: cultist
          persist-credentials: false

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Probe quality gates
        working-directory: cultist
        run: |
          cargo fmt --check
          cargo clippy --example rust_generator_ownership -- -D warnings
          cargo test --example rust_generator_ownership

      - name: Checkout pinned Oxc corpus
        uses: actions/checkout@v4
        with:
          repository: oxc-project/oxc
          ref: 8783524015b1e6ff1c39ccf426df0bb07cbbc588
          path: corpus/oxc
          persist-credentials: false

      - name: Preserve exact Oxc ownership relations
        run: |
          set -euo pipefail
          cargo run --quiet --manifest-path cultist/Cargo.toml --example rust_generator_ownership -- \
            corpus/oxc tasks/linter_codegen/src/main.rs | tee /tmp/oxc-generator-ownership.txt
          grep -F 'function generate_rule_runner_impls' /tmp/oxc-generator-ownership.txt
          grep -F 'reads  crates/oxc_linter/src/rules.rs' /tmp/oxc-generator-ownership.txt
          grep -F 'writes crates/oxc_linter/src/generated/rule_runner_impls.rs' /tmp/oxc-generator-ownership.txt
          grep -F 'function generate_rules_enum_file' /tmp/oxc-generator-ownership.txt
          grep -F 'writes crates/oxc_linter/src/generated/rules_enum.rs' /tmp/oxc-generator-ownership.txt
