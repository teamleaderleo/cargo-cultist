name: Rust syntax cohort research

on:
  push:
    branches:
      - experiment/history-rust-cohorts

permissions:
  contents: read

jobs:
  oxc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cargo-cultist
        uses: actions/checkout@v4
        with:
          path: cultist
          fetch-depth: 0
          persist-credentials: false

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Probe unit tests
        working-directory: cultist
        run: cargo test --example rust_syntax_cohort

      - name: Probe lint
        working-directory: cultist
        run: cargo clippy --example rust_syntax_cohort -- -D warnings

      - name: Checkout Oxc corpus pin
        uses: actions/checkout@v4
        with:
          repository: oxc-project/oxc
          ref: 8783524015b1e6ff1c39ccf426df0bb07cbbc588
          path: corpus/oxc
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Replay source registry cohort
        run: |
          mkdir -p research-output
          cargo run --quiet --manifest-path cultist/Cargo.toml --example rust_syntax_cohort -- \
            corpus/oxc crates/oxc_linter/src/rules.rs 100 \
            | tee research-output/oxc-rules-rust-syntax.txt

      - name: Replay generated registry reverse cohort
        run: |
          cargo run --quiet --manifest-path cultist/Cargo.toml --example rust_syntax_cohort -- \
            corpus/oxc crates/oxc_linter/src/generated/rules_enum.rs 100 \
            | tee research-output/oxc-rules-enum-rust-syntax.txt

      - name: Upload research receipt
        uses: actions/upload-artifact@v4
        with:
          name: rust-syntax-cohort-research
          path: research-output/
          if-no-files-found: error
