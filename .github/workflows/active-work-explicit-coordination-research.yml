name: Active-work explicit coordination research

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  explicit-coordination:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Replay public disjoint-path hold through live adapter helpers
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import json
          from pathlib import Path

          from active_work_heads_up_ci import (
              edge_involves_current,
              extract_coordination_edges,
              run_product_preflight,
          )

          metadata = json.loads(
              Path('research/fixtures/preflight-748-hold.json').read_text()
          )
          edges, extraction = extract_coordination_edges(metadata)
          assert len(edges) == 1, extraction
          assert edges[0] == {
              'kind': 'hold_merge_while',
              'from': '#748',
              'to': '#703',
              'source': 'github:pull/748',
          }, edges

          inventory = {
              'schema_version': 1,
              'source': 'public_preflight_748_replay',
              'observed_at': '2026-08-19T00:00:00Z',
              'current': {
                  'id': '#748',
                  'kind': 'pull_request',
                  'title': 'Cleanup extracted agent JAR staging artifacts',
                  'url': 'https://github.com/teamleaderleo/preflight/pull/748',
                  'head_ref': 'fixture/source',
                  'head_sha': 'a2e14c4265e3568d8f943906a53e3b0e16dca141',
                  'updated_at': '2026-08-18T19:11:15Z',
                  'draft': False,
                  'changed_paths': ['src/source-only.txt'],
              },
              'active_work': [
                  {
                      'id': '#748',
                      'kind': 'pull_request',
                      'title': 'Cleanup extracted agent JAR staging artifacts',
                      'url': 'https://github.com/teamleaderleo/preflight/pull/748',
                      'head_ref': 'fixture/source',
                      'head_sha': 'a2e14c4265e3568d8f943906a53e3b0e16dca141',
                      'updated_at': '2026-08-18T19:11:15Z',
                      'draft': False,
                      'changed_paths': ['src/source-only.txt'],
                  },
                  {
                      'id': '#703',
                      'kind': 'pull_request',
                      'title': 'Target held work',
                      'url': 'https://github.com/teamleaderleo/preflight/pull/703',
                      'head_ref': 'fixture/target',
                      'head_sha': '866e4466259a51857e932f0e78032363cb3ab908',
                      'updated_at': '2026-08-19T09:20:17Z',
                      'draft': False,
                      'changed_paths': ['src/target-only.txt'],
                  },
              ],
              'coordination_edges': edges,
          }

          assert edge_involves_current(inventory, edges[0])
          report = run_product_preflight(inventory)
          findings = report['findings']
          explicit = [
              finding for finding in findings
              if finding['kind'] == 'preflight-explicit-coordination'
          ]
          direct = [
              finding for finding in findings
              if finding['kind'] == 'preflight-inventory-path-overlap'
          ]
          assert len(explicit) == 1, report
          assert direct == [], report

          claims = explicit[0]['claims']
          assert any(
              claim['kind'] == 'observed'
              and 'no direct path overlap' in claim['message']
              for claim in claims
          ), explicit[0]
          assert any(
              claim['kind'] == 'unknown'
              and 'operational consequence or intent' in claim['message']
              for claim in claims
          ), explicit[0]
          print(
              'positive control: disjoint-path hold_merge_while reached product preflight'
          )
          print('source receipt:', extraction['source_receipts'][0])
          PY
