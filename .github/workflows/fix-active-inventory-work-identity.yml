name: Repair active inventory identity

on:
  push:
    branches:
      - fix/active-inventory-work-identity
    paths:
      - '.github/workflows/fix-active-inventory-work-identity.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/active-inventory-work-identity
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt

      - name: Apply reviewed identity repair and self-delete
        shell: bash
        env:
          SOURCE: src/active_changes.rs
          EXPECTED_BLOB: b8b2cc23802db8b6ae8f9cf5beebe08c2e583fd8
          SELF: .github/workflows/fix-active-inventory-work-identity.yml
        run: |
          set -euo pipefail
          test "$(git hash-object "$SOURCE")" = "$EXPECTED_BLOB"

          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/active_changes.rs')
          text = path.read_text()

          old = '''fn same_work(current: &WorkItem, other: &WorkItem) -> bool {
              current.id == other.id || current.head_sha == other.head_sha
          }
          '''
          new = '''fn same_work(current: &WorkItem, other: &WorkItem) -> bool {
              current.id == other.id
          }
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one same_work predicate, found {text.count(old)}')
          text = text.replace(old, new, 1)

          anchor = '''    #[test]
              fn explicit_coordination_survives_disjoint_paths() {
          '''
          regression = '''    #[test]
              fn distinct_work_ids_remain_distinct_when_their_heads_match() {
                  let current = work("#1", "shared", &["src/a.rs"]);
                  let other = work("#2", "shared", &["src/a.rs"]);
                  let edge = serde_json::json!({
                      "kind": "depends_on",
                      "from": "#1",
                      "to": "#2",
                      "source": "provider:shared-head"
                  });
                  let inventory = parse(document(current, vec![other], vec![edge])).unwrap();
                  let analysis = analyze_inventory(Path::new("/repo"), &inventory, None);

                  assert!(analysis.findings.iter().any(|finding| {
                      finding.kind == "preflight-inventory-path-overlap"
                  }));
                  assert!(analysis.findings.iter().any(|finding| {
                      finding.kind == "preflight-explicit-coordination"
                  }));
                  assert!(analysis.claims.iter().any(|claim| {
                      claim.message.contains("excluded 0 self candidate")
                  }));
              }

              #[test]
              fn explicit_coordination_survives_disjoint_paths() {
          '''
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one test anchor, found {text.count(anchor)}')
          path.write_text(text.replace(anchor, regression, 1))
          PY

          cargo fmt --all
          changed="$(git diff --name-only)"
          test "$changed" = "$SOURCE"
          cargo test active_changes

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SOURCE"
          git rm "$SELF"
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n%s\n' "$SELF" "$SOURCE" | sort)"
          test "$staged" = "$expected"
          git commit -m "fix: keep distinct active work identities"
          git push origin HEAD:fix/active-inventory-work-identity
