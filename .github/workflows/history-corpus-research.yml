name: History corpus research

on:
  push:
    branches:
      - experiment/history-companions
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cargo-cultist
        uses: actions/checkout@v4
        with:
          path: cultist
          fetch-depth: 0
          persist-credentials: false

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build cargo-cultist
        working-directory: cultist
        run: cargo build

      - name: Checkout Oxc corpus pin
        uses: actions/checkout@v4
        with:
          repository: oxc-project/oxc
          ref: 8783524015b1e6ff1c39ccf426df0bb07cbbc588
          path: corpus/oxc
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Replay Oxc rule-registry history
        run: |
          mkdir -p research-output
          cultist/target/debug/cargo-cultist history \
            --max-commits 100 \
            corpus/oxc/crates/oxc_linter/src/rules.rs \
            | tee research-output/oxc-rules.txt
          cultist/target/debug/cargo-cultist history \
            --max-commits 100 \
            --format json \
            corpus/oxc/crates/oxc_linter/src/rules.rs \
            > research-output/oxc-rules.json
          python -m json.tool research-output/oxc-rules.json >/dev/null

      - name: Replay Oxc generated-registry history
        run: |
          cultist/target/debug/cargo-cultist history \
            --max-commits 100 \
            corpus/oxc/crates/oxc_linter/src/generated/rules_enum.rs \
            | tee research-output/oxc-rules-enum.txt
          cultist/target/debug/cargo-cultist history \
            --max-commits 100 \
            --format json \
            corpus/oxc/crates/oxc_linter/src/generated/rules_enum.rs \
            > research-output/oxc-rules-enum.json
          python -m json.tool research-output/oxc-rules-enum.json >/dev/null

      - name: Checkout Codex corpus pin
        uses: actions/checkout@v4
        with:
          repository: openai/codex
          ref: 785ecd7452f87c7eb731fbb73892185cbdd9d5f9
          path: corpus/codex
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Replay Codex shared-protocol history
        run: |
          cultist/target/debug/cargo-cultist history \
            --max-commits 100 \
            corpus/codex/codex-rs/app-server-protocol/src/protocol/common.rs \
            | tee research-output/codex-protocol-common.txt
          cultist/target/debug/cargo-cultist history \
            --max-commits 100 \
            --format json \
            corpus/codex/codex-rs/app-server-protocol/src/protocol/common.rs \
            > research-output/codex-protocol-common.json
          python -m json.tool research-output/codex-protocol-common.json >/dev/null

      - name: Replay Codex v2 thread-protocol history
        run: |
          cultist/target/debug/cargo-cultist history \
            --max-commits 100 \
            corpus/codex/codex-rs/app-server-protocol/src/protocol/v2/thread.rs \
            | tee research-output/codex-v2-thread.txt
          cultist/target/debug/cargo-cultist history \
            --max-commits 100 \
            --format json \
            corpus/codex/codex-rs/app-server-protocol/src/protocol/v2/thread.rs \
            > research-output/codex-v2-thread.json
          python -m json.tool research-output/codex-v2-thread.json >/dev/null

      - name: Replay Codex exporter history
        run: |
          cultist/target/debug/cargo-cultist history \
            --max-commits 100 \
            corpus/codex/codex-rs/app-server-protocol/src/export.rs \
            | tee research-output/codex-export.txt
          cultist/target/debug/cargo-cultist history \
            --max-commits 100 \
            --format json \
            corpus/codex/codex-rs/app-server-protocol/src/export.rs \
            > research-output/codex-export.json
          python -m json.tool research-output/codex-export.json >/dev/null

      - name: Upload research receipts
        uses: actions/upload-artifact@v4
        with:
          name: history-corpus-research
          path: research-output/
          if-no-files-found: error
