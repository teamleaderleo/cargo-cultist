name: Format performance branch

on:
  push:
    branches:
      - perf/work-counters

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Apply rustfmt and remove temporary workflow
        run: |
          cargo fmt
          git rm .github/workflows/format-perf-work-counters.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply rustfmt to performance counters"
          git push origin HEAD:perf/work-counters
