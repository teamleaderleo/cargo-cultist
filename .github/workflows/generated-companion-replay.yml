name: Generated companion replay

on:
  pull_request:
    paths:
      - src/history.rs
      - .github/workflows/generated-companion-replay.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oxc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Check out pinned Oxc history
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/oxc-project/oxc.git /tmp/oxc
          git -C /tmp/oxc checkout --detach 8783524015b1e6ff1c39ccf426df0bb07cbbc588
      - name: Replay rules registry history
        run: |
          cargo run --quiet -- history --max-commits 100 --format json /tmp/oxc/crates/oxc_linter/src/rules.rs > /tmp/oxc-history.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/oxc-history.json').read_text())
          companions = {item['path']: item for item in report['companions']}
          expected = [
              'crates/oxc_linter/src/generated/rule_runner_impls.rs',
              'crates/oxc_linter/src/generated/rules_enum.rs',
          ]
          for path in expected:
              item = companions[path]
              assert item['support'] == 99, item
              assert item['opportunities'] == 100, item
              marker = item.get('generated_marker')
              assert marker, item
              assert marker['path'] == path, marker
              text = marker['marker'].lower()
              assert 'auto-generated' in text or 'do not edit' in text, marker
          print('OXC_GENERATED_COMPANION_REPLAY=PASS')
          for path in expected:
              item = companions[path]
              print(path, item['support'], item['opportunities'], item['generated_marker'])
          PY
