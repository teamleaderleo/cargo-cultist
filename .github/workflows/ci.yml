name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Exercise decision-memory research resolver
        run: |
          set -euo pipefail

          cargo run --quiet --example decision_memory -- \
            research/decision-memory src/history.rs \
            > /tmp/cultist-decision-history.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/cultist-decision-history.json').read_text())
          assert report['analysis'] == 'decision_memory', report
          assert report['target'] == 'src/history.rs', report
          assert len(report['decisions']) == 1, report
          decision = report['decisions'][0]
          assert decision['record']['id'] == 'history-cochange-remains-association-v1', decision
          assert decision['record']['scope']['path_prefix'] == 'src/history.rs', decision
          assert [item['reference'] for item in decision['record']['authority']] == [
              '#34', '#39', '#19'
          ], decision
          PY

          cargo run --quiet --example decision_memory -- \
            research/decision-memory src/main.rs \
            > /tmp/cultist-decision-unrelated.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/cultist-decision-unrelated.json').read_text())
          assert report['target'] == 'src/main.rs', report
          assert report['decisions'] == [], report
          PY

          bad_records="$(mktemp -d -p . decision-memory-invalid.XXXXXX)"
          cat > "$bad_records/unsupported.json" <<'EOF'
          {
            "schema_version": 99,
            "id": "unsupported",
            "kind": "test",
            "scope": {"path_prefix": "src/history.rs"},
            "reason": "invalid fixture",
            "authority": [{"kind": "issue", "reference": "#75"}]
          }
          EOF
          if cargo run --quiet --example decision_memory -- \
              "$bad_records" src/history.rs \
              > /tmp/cultist-decision-invalid.out \
              2> /tmp/cultist-decision-invalid.err; then
            echo "unsupported decision schema unexpectedly succeeded" >&2
            exit 1
          fi
          grep -q 'unsupported decision schema 99' /tmp/cultist-decision-invalid.err
          rm -rf "$bad_records"
      - name: Dogfood repository scan
        run: cargo run -- .
      - name: Dogfood repository JSON
        run: cargo run --quiet -- --format json . | python -m json.tool >/dev/null
      - name: Dogfood history companions
        run: cargo run -- history --max-commits 20 src/main.rs
      - name: Dogfood history JSON
        run: cargo run --quiet -- history --max-commits 20 --format json src/main.rs | python -m json.tool >/dev/null
      - name: Dogfood CI test-filter inventory
        run: cargo run -- ci-tests .
      - name: Dogfood CI test-filter JSON
        run: cargo run --quiet -- ci-tests --format json . | python -m json.tool >/dev/null
      - name: Exercise CI test-filter positive and control fixtures
        run: |
          set -euo pipefail

          fixture="$(mktemp -d)"
          mkdir -p "$fixture/src" "$fixture/.github/workflows"
          git -C "$fixture" init -q

          cat > "$fixture/src/lib.rs" <<'EOF'
          #[cfg(test)]
          mod tests {
              #[test]
              fn existing_test() {}
          }
          EOF

          cat > "$fixture/.github/workflows/test.yml" <<'EOF'
          name: fixture
          on: [push]
          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - run: cargo test --lib stale_filter
          EOF

          cargo run --quiet -- ci-tests --format json "$fixture" > /tmp/cultist-ci-test-stale.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/cultist-ci-test-stale.json').read_text())
          findings = report['findings']
          assert len(findings) == 1, findings
          finding = findings[0]
          assert finding['kind'] == 'ci-test-filter-inventory-miss', finding
          assert [claim['kind'] for claim in finding['claims']] == [
              'proven', 'observed', 'unknown'
          ], finding
          assert 'stale_filter' in finding['question'], finding
          PY

          sed -i 's/stale_filter/existing_test/' "$fixture/.github/workflows/test.yml"
          cargo run --quiet -- ci-tests --format json "$fixture" > /tmp/cultist-ci-test-control.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/cultist-ci-test-control.json').read_text())
          assert report['findings'] == [], report
          PY
      - name: Dogfood pull request diff
        if: github.event_name == 'pull_request'
        env:
          CULTIST_BASE: ${{ github.event.pull_request.base.sha }}
        run: cargo run -- diff --base "$CULTIST_BASE" .
      - name: Dogfood pull request JSON
        if: github.event_name == 'pull_request'
        env:
          CULTIST_BASE: ${{ github.event.pull_request.base.sha }}
        run: cargo run --quiet -- diff --base "$CULTIST_BASE" --format json . | python -m json.tool >/dev/null
      - name: Dogfood push diff
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          CULTIST_BASE: ${{ github.event.before }}
        run: cargo run -- diff --base "$CULTIST_BASE" .
